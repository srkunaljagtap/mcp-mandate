# Coverage-guided fuzzing with cargo-fuzz (libFuzzer). Needs nightly Rust:
#
#   cargo +nightly fuzz run gate_messages -- -max_total_time=60
#
# Kept out of the main workspace: it needs nightly and its own toolchain
# flags. CI runs every target weekly (.github/workflows/fuzz.yml).
[package]
name = "mcp-mandate-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
mcp-mandate-audit = { path = "../crates/mcp-mandate-audit" }
mcp-mandate-gate = { path = "../crates/mcp-mandate-gate" }
mcp-mandate-pin = { path = "../crates/mcp-mandate-pin" }
mcp-mandate-policy = { path = "../crates/mcp-mandate-policy" }
mcp-mandate-proxy = { path = "../crates/mcp-mandate-proxy" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["io-util", "rt"] }
toml = "1.1.8"

# Its own workspace, not part of the main one.
[workspace]

[[bin]]
name = "gate_messages"
path = "fuzz_targets/gate_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_stream"
path = "fuzz_targets/event_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit_log"
path = "fuzz_targets/audit_log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_file"
path = "fuzz_targets/policy_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pins_file"
path = "fuzz_targets/pins_file.rs"
test = false
doc = false
bench = false
