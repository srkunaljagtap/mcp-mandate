# Workspace root: groups the binary under bin/ and the libraries under crates/
# so they share one Cargo.lock, one target/ and the settings below.
[workspace]
resolver = "3"
members = ["bin/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/srkunaljagtap/mcp-mandate"

# Dependency versions are declared once here; crates opt in with
# `name.workspace = true`.
[workspace.dependencies]
mcp-mandate-scout = { path = "crates/mcp-mandate-scout", version = "0.1.0" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"
