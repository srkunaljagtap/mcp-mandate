name: Release

# Pushing a version tag (v0.1.0) on main builds the binaries for every
# platform, checksums and attests them, and drafts a GitHub release for a
# maintainer to review and publish. The same tag pushes the container image
# to GHCR, attested too.
on:
  push:
    tags: ["v*"]

# Least privilege: each job asks for what it needs below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: tag matches the version, on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is v + the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the workspace version $version"
            exit 1
          fi
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  binaries:
    name: build (${{ matrix.target }})
    needs: check
    strategy:
      matrix:
        include:
          # Linux binaries are built on the oldest supported Ubuntu, so they
          # run on any distribution with glibc 2.35 or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # No build cache here: a release is built from scratch.
      - run: cargo build --release --locked --bin mcp-mandate
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="mcp-mandate-$GITHUB_REF_NAME-$TARGET"
          mkdir "$name"
          cp README.md LICENSE-APACHE LICENSE-MIT "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/mcp-mandate.exe "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp target/release/mcp-mandate "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: mcp-mandate-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: draft the GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation on GitHub
    steps:
      # Only the archives: any other artifact of this run stays out of the
      # release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum mcp-mandate-* > SHA256SUMS
          cat SHA256SUMS
      # Records which workflow, commit and runner built each archive, signed,
      # so `gh attestation verify` can prove where a download came from.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mcp-mandate-*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/mcp-mandate-* dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "$GITHUB_REF_NAME" --generate-notes

  image:
    name: container image
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # GitHub detects only one of the two licenses, and its answer
          # would replace the Dockerfile's label.
          labels: |
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No build record artifact; the run's artifacts are the archives.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
