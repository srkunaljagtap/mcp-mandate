[package]
name = "mcp-mandate-audit"
description = "The mcp-mandate audit log: hash-chained JSON lines and their verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW, so the log never writes through a planted symlink.
nix.workspace = true

[target.'cfg(not(unix))'.dependencies]
# The open file's volume and file index, to notice the log being replaced.
same-file.workspace = true

[lints]
workspace = true
